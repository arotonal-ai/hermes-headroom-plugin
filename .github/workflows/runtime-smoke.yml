name: Runtime Manager Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-smoke.yml"
      - "pyproject.toml"
      - "src/hermes_headroom_plugin/proxy.py"
      - "src/hermes_headroom_plugin/runtime_manager.py"
      - "scripts/test-runtime-manager-lifecycle.py"
      - "tests/test_runtime_manager.py"
  workflow_dispatch:
    inputs:
      headroom_spec:
        description: "certified headroom-ai package spec to test"
        required: false
        default: "headroom-ai[proxy]==0.32.1"
      litellm_spec:
        description: "certified LiteLLM constraint"
        required: false
        default: "litellm==1.91.3"
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  runtime-manager-lifecycle:
    name: runtime-manager (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base plugin wheel path
        run: python -m pip install .
      - name: Setup, status, doctor, manifest and uninstall canary
        env:
          HEADROOM_AI_SPEC: ${{ github.event.inputs.headroom_spec || 'headroom-ai[proxy]==0.32.1' }}
          HEADROOM_LITELLM_SPEC: ${{ github.event.inputs.litellm_spec || 'litellm==1.91.3' }}
        run: >-
          python scripts/test-runtime-manager-lifecycle.py
          --manager-command headroom-runtime
          --runtime-root "${{ runner.temp }}/headroom-runtime-manager"
          --report runtime-manager-lifecycle.json
          --log runtime-manager-lifecycle.log
          --install-timeout 600
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-manager-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            runtime-manager-lifecycle.json
            runtime-manager-lifecycle.log
          if-no-files-found: warn
