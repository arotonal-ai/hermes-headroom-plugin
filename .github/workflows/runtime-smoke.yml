name: Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      headroom_spec:
        description: "headroom-ai package spec to test"
        required: false
        default: "headroom-ai[proxy]==0.31.0"
      litellm_spec:
        description: "LiteLLM constraint to test; certified default remains portable across the matrix"
        required: false
        default: "litellm==1.91.3"
  schedule:
    # Weekly certification smoke. Keep push CI fast; use this for real proxy runtime drift.
    - cron: "17 9 * * 1"

jobs:
  runtime-smoke:
    name: runtime-smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full upstream proxy + plugin runtime smoke
        env:
          HEADROOM_AI_SPEC: ${{ github.event.inputs.headroom_spec || 'headroom-ai[proxy]==0.31.0' }}
          HEADROOM_LITELLM_SPEC: ${{ github.event.inputs.litellm_spec || 'litellm==1.91.3' }}
        run: python scripts/test-headroom-runtime-smoke.py --install-timeout 600
