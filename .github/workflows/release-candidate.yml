name: Release Candidate Local Gate

on:
  workflow_dispatch:
    inputs:
      headroom_spec:
        description: "headroom-ai package spec to test"
        required: false
        default: "headroom-ai[proxy]==0.33.0"
      litellm_spec:
        description: "LiteLLM constraint to test; certified default remains portable across the matrix"
        required: false
        default: "litellm==1.94.0rc3"
      compat_headroom_spec:
        description: "isolated plugin-compatibility/rollback Headroom spec"
        required: false
        default: "headroom-ai[proxy]==0.31.0"

permissions:
  contents: read

jobs:
  release-candidate-local-gate:
    name: release-candidate-local-gate (ubuntu, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The rollback gate archives v0.5.2 and therefore needs tag history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run package/runtime release-candidate gate (target-host Hermes install deferred)
        env:
          HEADROOM_AI_SPEC: ${{ github.event.inputs.headroom_spec || 'headroom-ai[proxy]==0.33.0' }}
          HEADROOM_LITELLM_SPEC: ${{ github.event.inputs.litellm_spec || 'litellm==1.94.0rc3' }}
          HEADROOM_COMPAT_AI_SPEC: ${{ github.event.inputs.compat_headroom_spec || 'headroom-ai[proxy]==0.31.0' }}
        run: python scripts/release-candidate-local-gate.py --install-timeout 600 --allow-hermes-install-deferred
      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-runs
          path: release-candidate-runs/
          if-no-files-found: warn
