name: Release Candidate Local Gate

on:
  workflow_dispatch:
    inputs:
      headroom_spec:
        description: "headroom-ai package spec to test"
        required: false
        default: "headroom-ai[proxy]==0.31.0"
      litellm_spec:
        description: "LiteLLM constraint to test; certified default remains portable across the matrix"
        required: false
        default: "litellm==1.91.3"

jobs:
  release-candidate-local-gate:
    name: release-candidate-local-gate (ubuntu, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run local release-candidate gate
        env:
          HEADROOM_AI_SPEC: ${{ github.event.inputs.headroom_spec || 'headroom-ai[proxy]==0.31.0' }}
          HEADROOM_LITELLM_SPEC: ${{ github.event.inputs.litellm_spec || 'litellm==1.91.3' }}
        run: python scripts/release-candidate-local-gate.py --install-timeout 600
      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-runs
          path: release-candidate-runs/
          if-no-files-found: warn
