manifest_version: 1
name: headroom_retrieve
description: "Portable tool-layer Headroom integration for Hermes: eligible tool-result compression, CCR retrieval, bounded local reports, loopback runtime, and no global provider routing."
author: Hermes Headroom contributors
kind: standalone
provides_tools:
  - headroom_retrieve
provides_hooks:
  - transform_terminal_output
  - transform_llm_output
  - pre_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
