[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-headroom-plugin"
version = "0.4.1"
description = "Hermes Agent plugin for safe Headroom context reduction, CCR retrieval, proxy smoke tests, and loopback-first runtime guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hermes Headroom contributors" }]
dependencies = [
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/arotonal-ai/hermes-headroom-plugin"
Repository = "https://github.com/arotonal-ai/hermes-headroom-plugin"
"Upstream Headroom" = "https://github.com/headroomlabs-ai/headroom"
"Upstream Headroom Docs" = "https://headroom-docs.vercel.app/docs"
"headroom-ai on PyPI" = "https://pypi.org/project/headroom-ai/"

[project.optional-dependencies]
# Reproducible portable-core runtime. Operators may override the installer with
# --spec/HEADROOM_AI_SPEC for an explicit canary or incident rollback.
proxy = [
  "headroom-ai[proxy]==0.31.0",
  "litellm==1.91.3",
]
test = ["pytest>=8,<10"]
release = ["build>=1,<2"]

[project.entry-points."hermes_agent.plugins"]
headroom_retrieve = "hermes_headroom_plugin"

[project.scripts]
headroom-health-audit = "hermes_headroom_plugin.health:main"
headroom-proxy-start = "hermes_headroom_plugin.proxy:main"
headroom-worker-lane = "hermes_headroom_plugin.wrappers:worker_main"
headroom-background-lane = "hermes_headroom_plugin.wrappers:background_main"
headroom-command-preflight = "hermes_headroom_plugin.wrappers:preflight_main"
headroom-events-summary = "hermes_headroom_plugin.commands:events_summary_main"
headroom-adoption-benchmark = "hermes_headroom_plugin.benchmark:main"
headroom-cache-effectiveness = "hermes_headroom_plugin.cache_effectiveness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_headroom_plugin = ["skills/*/SKILL.md", "data/systemd/*.template", "companions/llm-monitor/*"]

[tool.setuptools.data-files]
"share/doc/hermes-headroom-plugin" = ["docs/portable-core.md", "docs/MIGRATION-v0.4.md"]

[tool.pytest.ini_options]
norecursedirs = ["qa", "release-candidate-runs", "context-economy-loop-gate-runs", "build", "dist", ".git"]
